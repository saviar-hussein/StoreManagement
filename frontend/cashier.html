<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoreManager - Cashier</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body class="min-h-screen bg-gradient-to-br from-pink-50 via-white to-fuchsia-50 text-gray-800 flex items-center justify-center p-4">

  <div class="w-full max-w-md glass rounded-3xl p-8 sm:p-10 border border-pink-100 shadow-2xl text-center">

    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-pink-500 to-fuchsia-500 text-white flex items-center justify-center shadow-lg shadow-pink-300/50 mb-6">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
    </div>

    <h1 id="welcome-text" class="text-2xl font-extrabold text-gray-900 mb-2">Welcome</h1>
    <p class="text-gray-500 mb-8">Nothing available yet.</p>

    <button id="btn-logout" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-pink-500 to-fuchsia-500 text-white font-semibold shadow-lg hover:shadow-pink-300/50 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200">
      Logout
    </button>

  </div>

  <script>
    // Auth check: if not logged in, send back to login
    if (!localStorage.getItem('auth_token')) {
      window.location.href = 'login.html';
    }

    // Personalize the greeting with the cashier's name, if available
    try {
      const user = JSON.parse(localStorage.getItem('auth_user') || '{}');
      if (user.name) {
        document.getElementById('welcome-text').textContent = `Welcome, ${user.name}`;
      }
    } catch (e) {
      // No stored user info — keep the generic greeting.
    }

    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      window.location.href = 'login.html';
    });
  </script>

</body>
</html>
